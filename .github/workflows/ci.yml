name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff format --check .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: mypy src

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # The 3.12 job reports coverage (machine-readable, additive — no fail-under
      # gate). Other matrix versions keep running plain tests.
      - name: Run tests
        if: matrix.python-version != '3.12'
        run: pytest -q
      - name: Run tests with coverage
        if: matrix.python-version == '3.12'
        run: pytest -q --cov=nexus_exchange --cov-report=term-missing --cov-report=xml
      - name: Emit coverage percentage
        if: matrix.python-version == '3.12'
        run: |
          set -euo pipefail
          pct="$(python -c "import xml.etree.ElementTree as ET; print(round(float(ET.parse('coverage.xml').getroot().get('line-rate')) * 100, 2))")"
          echo "Test coverage: ${pct}%"
          {
            echo "## Test coverage"
            echo ""
            echo "**${pct}%** line coverage (\`nexus_exchange\`, Python 3.12)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error

  # Verification: does the SDK still match the spec it *pins*? Both directions —
  # every endpoints.txt entry exists in the pinned spec, and the operations the
  # client code requests are exactly that list (modulo two named allowlists in the
  # checker). Distinct from the `drift` job below, which asks the *lag* question:
  # is the pin the latest release?
  #
  # Deliberately NOT path-filtered. This has to run on the spec-autobump PR, where
  # the pin itself is the change — a trigger gated on spec-file diffs would look
  # correct and verify nothing. It is cheap: one cached fetch, no dependencies.
  spec-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Read the pinned spec version
        id: pin
        run: |
          set -euo pipefail
          tag="$(tr -d '[:space:]' < .api-version)"
          # Validate before the value reaches a URL or a cache key: `.api-version`
          # is attacker-controlled on a fork PR.
          if [[ ! "$tag" =~ ^v[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error file=.api-version::.api-version must look like vX.Y.Z (got: '$tag')"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Cache the pinned spec
        id: cache
        uses: actions/cache@v6
        with:
          path: openapi.pinned.json
          key: spec-${{ steps.pin.outputs.tag }}

      - name: Fetch the pinned spec (cache miss only)
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          # Passed as data, not interpolated into the script; validated above.
          SPEC_TAG: ${{ steps.pin.outputs.tag }}
        run: |
          set -euo pipefail
          # raw-at-tag, so the release asset download_count stays a clean external
          # adoption signal.
          curl -fsSL \
            "https://raw.githubusercontent.com/nexus-xyz/nexus-exchange-api/${SPEC_TAG}/openapi.json" \
            -o openapi.pinned.json

      # Self-test first: a green drift run is only evidence if the checker can go
      # red. This proves it does — including for the exact manifest bug it fixed.
      - name: Self-test the drift checker
        run: python3 scripts/test_check_spec_drift.py

      # The checker re-derives the pinned tag itself and refuses to run if the spec
      # file does not declare that version, so a stale cache entry cannot pass.
      - name: Check spec drift
        run: python3 scripts/check_spec_drift.py openapi.pinned.json

  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check pinned API spec version against latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPEC_REPO: nexus-xyz/nexus-exchange-api
        run: |
          set -euo pipefail
          pinned="$(tr -d '[:space:]' < .api-version)"
          [ -n "$pinned" ] || { echo "::error file=.api-version::.api-version is empty"; exit 1; }
          echo "Pinned API spec version: $pinned"
          api="https://api.github.com/repos/${SPEC_REPO}"
          pinned_status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "${api}/releases/tags/${pinned}")"
          [ "$pinned_status" = "200" ] || { echo "::error::Pinned spec ${pinned} not found as a release in ${SPEC_REPO} (HTTP ${pinned_status})."; exit 1; }
          latest="$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "${api}/releases/latest" | jq -r '.tag_name // empty')"
          [ -n "$latest" ] || { echo "::error::Could not determine latest release of ${SPEC_REPO}."; exit 1; }
          echo "Latest API spec release:  $latest"
          if [ "$pinned" != "$latest" ]; then
            echo "::error::Spec drift: SDK pins ${pinned} but the latest Exchange API spec is ${latest}. Bump .api-version (and the README table) once updated."
            exit 1
          fi
          echo "No drift: pinned to the latest API spec (${pinned})."
