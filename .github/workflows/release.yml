name: Release

# The build half of the release. Given a `vX.Y.Z` tag, this builds the
# sdist/wheel, attaches them to a GitHub release whose notes are the matching
# CHANGELOG section, and — once opted in — publishes to PyPI via Trusted
# Publishing (OIDC).
#
# It does not decide the version. `release-please.yml` does that from commit
# history (ENG-7536) and then dispatches this workflow with the tag it cut; see
# that file for the pre-1.0 policy and the reason the handoff is a dispatch
# rather than a tag push. Pushing a `vX.Y.Z` tag by hand still works and takes
# the same path, so this stays usable if release-please is ever removed.
#
# Safety model:
#   * The tag version MUST equal pyproject.toml's version (guard below), so a
#     release can never disagree with the code it ships.
#   * A version >= 1.0.0 is refused unless the repo variable
#     ALLOW_MAJOR_RELEASE=true. Pre-1.0 is what currently tells integrators
#     "no compatibility guarantee"; leaving it has to be a deliberate act, not a
#     bump that slipped through.
#   * The full check suite (ruff/mypy/pytest) runs before anything is built, so a
#     red tree is never released. Neither a tag push nor a dispatch runs CI, so
#     this is the only gate on the released commit.
#   * The CHANGELOG must contain a non-empty section for the version, or the run
#     fails — no empty/placeholder release notes.
#   * release-please creates its GitHub release as a DRAFT; this workflow
#     undrafts it only after the artifacts are attached, so a published release
#     with no artifacts never exists.
#   * Least privilege: the default token is read-only; only the release job gets
#     `contents: write` and only the publish job gets `id-token: write`.
#   * PyPI publishing stays DORMANT until the maintainer sets the repo variable
#     PYPI_ENABLED=true and configures the `pypi` environment with a trusted
#     publisher on pypi.org. Until then that job is skipped and releases never
#     fail on unconfigured PyPI.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to release (must already be pushed)"
        required: true
        type: string

permissions:
  contents: read

# One release per tag at a time. Not cancel-in-progress: a publish must never be
# killed mid-upload.
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve and validate the tag
        id: resolve
        # RAW_TAG is untrusted (a workflow_dispatch input); validate its shape
        # strictly before it is used as a git ref or in any later step.
        env:
          RAW_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$RAW_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Release tag must look like vX.Y.Z (got: '$RAW_TAG')."
            exit 1
          fi
          echo "tag=$RAW_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RAW_TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve.outputs.tag }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Guard — tag version matches pyproject.toml
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          proj="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "pyproject.toml version: $proj"
          echo "tag version:            $VERSION"
          if [ "$proj" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match pyproject.toml version ($proj). Merge the release-please PR (it bumps both) rather than tagging by hand."
            exit 1
          fi

      # Second lock on the 1.0 door. release-please's bump-minor-pre-major +
      # bump-patch-for-minor-pre-major cannot compute a 1.0.0, so reaching here
      # with a major version means either those flags were dropped or someone
      # tagged by hand — both fine, but only as a decision someone made on
      # purpose. Setting ALLOW_MAJOR_RELEASE=true is that decision.
      - name: Guard — crossing 1.0 must be deliberate
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          ALLOW_MAJOR: ${{ vars.ALLOW_MAJOR_RELEASE }}
        run: |
          set -euo pipefail
          major="${VERSION%%.*}"
          if [ "$major" != "0" ] && [ "$ALLOW_MAJOR" != "true" ]; then
            echo "::error::Refusing to release $VERSION: this SDK is pre-1.0 (see CONTRIBUTING.md 'Toward 1.0'). Committing to a stable surface means setting the repo variable ALLOW_MAJOR_RELEASE=true first."
            exit 1
          fi
          echo "Version $VERSION passes the pre-1.0 policy check."

      - run: pip install -e ".[dev]" build twine

      - name: Verify the tree is releasable (lint, types, tests)
        run: |
          set -euo pipefail
          ruff format --check .
          ruff check .
          mypy src
          pytest -q

      - name: Extract release notes from CHANGELOG
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          python scripts/changelog_notes.py "$VERSION" > release-notes.md
          echo "---- release notes ----"
          cat release-notes.md

      - name: Build sdist and wheel
        run: |
          set -euo pipefail
          rm -rf dist
          python -m build

      - name: Verify built artifacts match the tag
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          ls -la dist
          test -f "dist/nexus_exchange-${VERSION}-py3-none-any.whl"
          test -f "dist/nexus_exchange-${VERSION}.tar.gz"
          # Exactly the two expected artifacts — nothing stale from a prior build.
          count="$(find dist -maxdepth 1 -type f | wc -l)"
          if [ "$count" -ne 2 ]; then
            echo "::error::Expected exactly 2 files in dist/, found $count:"
            find dist -maxdepth 1 -type f
            exit 1
          fi
          # Metadata sanity (long-description render, etc.) before we ship it.
          twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: |
            dist/*
            release-notes.md
          if-no-files-found: error

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: .

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            # Either release-please's draft, or a re-run of this workflow.
            echo "Release $TAG already exists — refreshing notes and assets."
            # Assets first, `--draft=false` last: undrafting is what makes the
            # release public, so it must be the final step. On a re-run of an
            # already-published release `--draft=false` is a no-op.
            gh release upload "$TAG" --repo "$REPO" --clobber dist/*
            gh release edit "$TAG" --repo "$REPO" \
              --notes-file release-notes.md \
              --draft=false
          else
            # --verify-tag: refuse to create a release for a tag that does not
            # exist in the repo.
            gh release create "$TAG" --repo "$REPO" \
              --title "$TAG" \
              --notes-file release-notes.md \
              --verify-tag \
              dist/*
          fi

  pypi-publish:
    # Also gated on github-release: a PyPI version can never be unpublished and
    # reused, so the irreversible step goes last — after the reversible one has
    # made the release public. Without this ordering a failed undraft would leave
    # the package on PyPI with no visible release to match it.
    needs: [build, github-release]
    runs-on: ubuntu-latest
    # Dormant until opted in — see the header. Skipped entirely when the repo
    # variable is unset, so a normal release never touches PyPI.
    if: ${{ vars.PYPI_ENABLED == 'true' }}
    environment:
      name: pypi
      url: https://pypi.org/project/nexus-exchange/
    permissions:
      id-token: write # OIDC token for Trusted Publishing; no API token stored.
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: .

      - name: Publish to PyPI (Trusted Publishing / OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # Idempotent: a re-run of an already-published version is a no-op
          # rather than a hard failure.
          skip-existing: true
