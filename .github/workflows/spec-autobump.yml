name: Spec autobump

# Auto-pick-up a new nexus-exchange-api spec release. When the api repo cuts a
# release it fans out a `repository_dispatch` (`spec-released`, carrying the new
# tag); a daily `schedule` poll is the self-healing fallback if a dispatch is
# dropped or not yet wired. Either way this workflow:
#
#   1. resolves the target tag (dispatch payload, manual input, or the api repo's
#      latest release) and confirms it is newer than `.api-version`,
#   2. fetches the currently-pinned spec and the target spec (same raw-at-tag URL
#      the spec-drift check uses — the release asset download_count stays reserved
#      as an external adoption signal),
#   3. runs oasdiff to classify old-pin -> new as BREAKING vs NON-BREAKING,
#   4. bumps `.api-version`, the README "currently targets" line, and the baked
#      `DEFAULT_API_VERSION` constant (scripts/sync_api_version.py), and opens a PR.
#
#   * NON-BREAKING -> label `spec-autobump`, arm auto-merge (squash) if the repo
#                     allows it, and say plainly in the PR when it does not.
#   * BREAKING     -> label `breaking · needs-SDK-update`, request review, do NOT
#                     arm auto-merge.
#
# It deliberately does NOT touch the README SDK<->spec compatibility table: that
# table records what *released* versions shipped against, so a bare spec release
# changes nothing in it. A row is appended when a release goes out.
#
# WHAT MAKES THIS SAFE (ENG-7960): the `spec-drift` job in ci.yml. It runs on every
# PR with no path filter, so it runs on this bot's PR too, where the pin IS the
# change — and it fails if the new spec no longer defines an operation this SDK
# implements. Before that check existed, this repo had automation opening pin-bump
# PRs with nothing verifying them, which is strictly worse than manual bumps.
# Arming auto-merge never merges by itself: the PR still needs its required checks
# green AND the ENG-4149 ruleset bypass, which does not exist yet.
#
# Supersedes `api-version-sync.yml` (poll-only, no oasdiff gate), removed in the
# same change; its pin-bump helper (scripts/sync_api_version.py) is reused here.
# Modelled on nexus-exchange-rs (ENG-3563), the reference implementation — see its
# docs/spec-autobump-replication.md.
#
# One cross-repo follow-up remains: nexus-exchange-api's spec-dispatch.yml still
# has this repo commented out of its fan-out matrix. Until that line is enabled,
# the daily poll is the only trigger, so a release is picked up within a day
# instead of within a minute.

on:
  repository_dispatch:
    types: [spec-released]
  schedule:
    # Daily fallback poll; the dispatch from the api repo is the fast path.
    - cron: "23 8 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Spec tag to evaluate (e.g. v0.8.0). Defaults to api repo latest."
        required: false

permissions:
  contents: write
  pull-requests: write
  # Labels live on the issues API, and this workflow creates its two labels
  # idempotently rather than depending on manual repo setup.
  issues: write

concurrency:
  # Serialize on the workflow, not the tag: two near-simultaneous releases must
  # not race to bump the same pin.
  group: spec-autobump
  cancel-in-progress: false

env:
  SPEC_REPO: nexus-xyz/nexus-exchange-api
  # Pinned deliberately. oasdiff decides breaking vs non-breaking, so an unpinned
  # version would let a tool release silently re-classify a spec change — the same
  # class of problem as an unpinned formatter (ENG-7728). Bump it in its own PR.
  OASDIFF_VERSION: "1.27.0"

jobs:
  autobump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # A PR opened with the default GITHUB_TOKEN does not trigger other
          # workflows, which would leave the bump PR with no `spec-drift` run —
          # unverified, the exact failure this design exists to prevent. Prefer the
          # fleet-standard bump token (ENG-4149), fall back to this repo's older
          # secret name, then to github.token (checks must be re-run by hand).
          token: >-
            ${{ secrets.SDK_DISPATCH_TOKEN || secrets.API_VERSION_SYNC_TOKEN
                || github.token }}

      - name: Resolve target tag
        id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }} # lifts the releases-API rate limit
          # A dispatch payload is untrusted input; keep it as data, never inlined.
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          tag="${DISPATCH_TAG:-${INPUT_TAG:-}}"
          if [ -z "$tag" ]; then
            # Scheduled path: ask the api repo for its latest release tag.
            tag="$(gh api "repos/${SPEC_REPO}/releases/latest" --jq .tag_name)"
          fi
          # Validate strictly before the tag reaches a URL, a file, or a branch
          # name.
          if [[ ! "$tag" =~ ^v[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::resolved tag is not vX.Y.Z: '$tag'"
            exit 1
          fi
          pinned="$(tr -d '[:space:]' < .api-version)"
          if [[ ! "$pinned" =~ ^v[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error file=.api-version::.api-version is not vX.Y.Z: '$pinned'"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          echo "Resolved target tag: $tag (currently pinned: $pinned)"

      - name: Stop if not newer than the pin
        id: gate
        env:
          NEW_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          # Reuse the lag check: exit 3 == behind (a newer spec exists), 0 == the
          # pin is current or ahead, anything else is a real error.
          if python3 scripts/sync_api_version.py --check --latest "$NEW_TAG"; then
            echo "Pin is already at or ahead of $NEW_TAG; nothing to bump."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            rc=$?
            if [ "$rc" -eq 3 ]; then
              echo "A newer spec ($NEW_TAG) is available; proceeding."
              echo "proceed=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error::sync_api_version.py --check failed (exit $rc)"
              exit "$rc"
            fi
          fi

      - name: Fetch pinned + target specs
        if: steps.gate.outputs.proceed == 'true'
        env:
          OLD_TAG: ${{ steps.resolve.outputs.pinned }}
          NEW_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/${SPEC_REPO}"
          curl -fsSL "${base}/${OLD_TAG}/openapi.json" -o "$RUNNER_TEMP/spec-old.json"
          curl -fsSL "${base}/${NEW_TAG}/openapi.json" -o "$RUNNER_TEMP/spec-new.json"

      - name: Install oasdiff
        if: steps.gate.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          # Pinned release archive + its published checksum, rather than piping the
          # project's install script into a shell. The pin is what matters for
          # classification stability; the checksum only proves the download matches
          # what that release published (same origin, so it is an integrity check,
          # not an independent trust anchor).
          base="https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}"
          archive="oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSL "${base}/${archive}" -o "$archive"
          curl -fsSL "${base}/checksums.txt" -o checksums.txt
          grep " ${archive}\$" checksums.txt | sha256sum --check --strict -
          tar -xzf "$archive" oasdiff
          ./oasdiff --version

      - name: Classify old-pin -> new with oasdiff
        if: steps.gate.outputs.proceed == 'true'
        id: oasdiff
        run: |
          set -euo pipefail
          oasdiff="$RUNNER_TEMP/oasdiff"
          old="$RUNNER_TEMP/spec-old.json"
          new="$RUNNER_TEMP/spec-new.json"

          # Informational changelog in the log for the PR reviewer.
          "$oasdiff" changelog "$old" "$new" || true

          # Captured for the PR body.
          "$oasdiff" breaking "$old" "$new" --format text \
            > "$RUNNER_TEMP/oasdiff-breaking.txt" 2>&1 || true

          # The classification: `--fail-on ERR` exits non-zero iff there is an
          # ERR-level (breaking) change; WARN/INFO-level changes are non-breaking.
          if "$oasdiff" breaking "$old" "$new" --fail-on ERR; then
            echo "verdict=non-breaking" >> "$GITHUB_OUTPUT"
            echo "No ERR-level (breaking) changes — NON-BREAKING."
          else
            echo "verdict=breaking" >> "$GITHUB_OUTPUT"
            echo "ERR-level (breaking) change(s) detected — BREAKING."
          fi

      - name: Apply the pin bump
        if: steps.gate.outputs.proceed == 'true'
        env:
          NEW_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          python3 scripts/sync_api_version.py --write --latest "$NEW_TAG"

      - name: Open the bump PR
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: >-
            ${{ secrets.SDK_DISPATCH_TOKEN || secrets.API_VERSION_SYNC_TOKEN
                || github.token }}
          NEW_TAG: ${{ steps.resolve.outputs.tag }}
          OLD_TAG: ${{ steps.resolve.outputs.pinned }}
          VERDICT: ${{ steps.oasdiff.outputs.verdict }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No file change after the bump — nothing to open."
            exit 0
          fi

          branch="chore/spec-autobump-${NEW_TAG}"

          # Idempotent: if the branch already exists upstream, or an open PR is
          # already on it, leave it rather than churning a duplicate each poll.
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "Branch $branch already exists upstream; nothing to do."
            exit 0
          fi
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "An open PR for $branch already exists; nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          # Exactly the three files sync_api_version.py owns — the pin, the managed
          # README line, and the baked header constant. Nothing else, so a red
          # spec-drift on this PR always means the spec changed, never that the bot
          # edited code.
          git add .api-version README.md src/nexus_exchange/client.py
          git commit -m "chore(spec): bump .api-version to ${NEW_TAG}"
          git push --set-upstream origin "$branch"

          # Labels are created idempotently: this repo does not have them yet, and
          # `gh pr create --label` fails outright on an unknown label.
          gh label create "spec-autobump" --force --color 0e8a16 \
            --description "Automated non-breaking .api-version bump (ENG-7960)"
          gh label create "breaking · needs-SDK-update" --force --color d93f0b \
            --description "Spec bump is breaking; needs human SDK changes (ENG-7960)"

          # Auto-merge is a repo setting. Probe it instead of arming blind: with
          # `allow_auto_merge: false` the arm call fails and the PR would otherwise
          # look armed when nobody is coming to merge it.
          auto_merge="not-attempted"
          if [ "$VERDICT" = "non-breaking" ]; then
            if [ "$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.allow_auto_merge')" = "true" ]; then
              auto_merge="armed"
            else
              auto_merge="unavailable"
              echo "::warning::Auto-merge is disabled on this repository" \
                   "(allow_auto_merge=false), so it was NOT armed — a human must merge" \
                   "this PR. Enable 'Allow auto-merge' in the repo settings to change that."
            fi
          fi

          python3 scripts/render_autobump_pr_body.py \
            --new-tag "$NEW_TAG" \
            --old-tag "$OLD_TAG" \
            --verdict "$VERDICT" \
            --oasdiff-file "$RUNNER_TEMP/oasdiff-breaking.txt" \
            --oasdiff-version "$OASDIFF_VERSION" \
            --auto-merge "$auto_merge" \
            > "$RUNNER_TEMP/pr-body.md"

          if [ "$VERDICT" = "non-breaking" ]; then
            gh pr create --base main --head "$branch" \
              --title "chore(spec): bump .api-version to ${NEW_TAG}" \
              --body-file "$RUNNER_TEMP/pr-body.md" \
              --label "spec-autobump"
            if [ "$auto_merge" = "armed" ]; then
              # Arming does not merge: required checks (spec-drift, test) plus the
              # ENG-4149 bypass still gate it.
              gh pr merge "$branch" --auto --squash
            fi
          else
            gh pr create --base main --head "$branch" \
              --title "chore(spec): bump .api-version to ${NEW_TAG}" \
              --body-file "$RUNNER_TEMP/pr-body.md" \
              --label "breaking · needs-SDK-update"
            # Route to a human; do NOT arm auto-merge.
            gh pr edit "$branch" --add-reviewer nexus-xyz/eng || \
              echo "::warning::could not request review (team handle may differ); add a reviewer manually."
          fi
