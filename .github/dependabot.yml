version: 2
updates:
  # Python dependencies (pyproject.toml).
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    groups:
      # Collapse routine patch/minor bumps into one PR to cut review noise;
      # majors still open individually so breaking changes get scrutiny.
      pip-minor:
        # `ruff` is excluded so its bump always arrives as its own PR: raising
        # the bound in pyproject.toml's `dev` extra can require reformatting the
        # tree, and that reformat has to be the diff under review rather than a
        # surprise folded into a grouped bump. It matches no other group in this
        # ecosystem, so dependabot opens it as an ungrouped PR.
        exclude-patterns:
          - "ruff"
        update-types:
          - minor
          - patch

  # GitHub Actions used by our workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci"
    groups:
      actions-minor:
        update-types:
          - minor
          - patch
